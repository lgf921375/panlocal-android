name: Android real launch smoke test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/smoke-android.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Enable Linux KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator cold-launch and crash test
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -euo pipefail
            gradle --no-daemon :app:assembleDebug
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n com.panlocal.tool/.LocalDriveActivity
            sleep 7
            if ! adb shell pidof com.panlocal.tool; then
              adb logcat -d -b main -b crash | tail -180
              echo 'FAIL: app process exited after launch'
              exit 1
            fi
            if adb logcat -d -b crash | grep -Eq 'FATAL EXCEPTION|Process: com.panlocal.tool'; then
              adb logcat -d -b crash | tail -180
              echo 'FAIL: Android fatal crash'
              exit 1
            fi
            adb shell dumpsys activity activities | grep -m 1 'com.panlocal.tool/.LocalDriveActivity'
            echo 'PASS: installed and launched without fatal exception'
