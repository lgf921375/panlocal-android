name: Build PanLocal Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Install Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compile debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/PanLocal-v0.1-debug.apk
          (cd dist && sha256sum PanLocal-v0.1-debug.apk > SHA256SUMS.txt)

      - name: Upload phone-installable APK
        uses: actions/upload-artifact@v4
        with:
          name: PanLocal-Android-APK
          path: dist/
          if-no-files-found: error
          retention-days: 14
